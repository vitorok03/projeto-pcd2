[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soja-clima"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "requests",
    "geopandas",
    "geobr",
    "duckdb<2",
    "shapely",
    "rasterio",
    "rasterstats",
    "matplotlib",
    "plotly",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
